<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Manager</title>
  <link rel="stylesheet" href="../src/style.css" />
</head>
<body>
  <div id="popup-app">
    <div class="card-header">
      <h2 class="card-title">🔄 PR Manager</h2>
      <div class="flex items-center gap-2">
        <button id="refresh-list" class="icon-button ghost" title="Refresh">
          <span>🔄</span>
        </button>
        <button id="open-settings" class="icon-button ghost" title="Settings">
          <span>⚙️</span>
        </button>
      </div>
    </div>
    
    <div id="pr-list" class="mb-4"></div>
    
    <div class="button-group centered">
      <button id="add-pr-page" class="primary">
        <span>➕</span>
        Add PR Page
      </button>
    </div>
    
    <div id="status-message" class="notification info hidden">
      <span id="status-text"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
