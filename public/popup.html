<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Manager</title>
  <link rel="stylesheet" href="../src/style.css" />
</head>
<body>
  <div id="popup-app">
    <div class="card-header">
      <h2 class="card-title">🔄 PR Manager</h2>
      <div class="flex items-center gap-2">
        <button id="refresh-list" class="icon-button ghost" title="Refresh">
          <span>🔄</span>
        </button>
        <button id="open-settings" class="icon-button ghost" title="Settings">
          <span>⚙️</span>
        </button>
      </div>
    </div>
    
    
    <div class="button-group centered">
      <button id="check-now" class="secondary">
        <span>🔔</span>
        Check Now
      </button>
    </div>
    
    <div class="button-group centered">
      <button id="show-pr-overview" class="secondary">
        <span>📋</span>
        Show PR Overview
      </button>
    </div>
    
    <div id="pr-overview-section" class="card hidden">
      <div class="card-header">
        <h3 class="card-title">📋 PR Overview</h3>
        <button id="close-pr-overview" class="icon-button ghost">
          <span>✕</span>
        </button>
      </div>
      <div class="pr-overview-container">
        <div id="pr-overview-content" class="pr-overview-content"></div>
        <div class="button-group centered">
          <button id="copy-pr-overview" class="secondary">
            <span>📋</span>
            Copy to Clipboard
          </button>
        </div>
      </div>
    </div>
    
    <div id="status-message" class="notification info hidden">
      <span id="status-text"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
