<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Manager</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../src/bootstrap-custom.css" />
</head>
<body>
  <div id="popup-app" class="container-fluid p-3" style="width: 400px;">
    <!-- Header -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">🔄 PR Manager</h5>
        <div class="btn-group" role="group">
          <button id="refresh-list" class="btn btn-outline-light btn-sm" title="Refresh">
            🔄
          </button>
          <button id="open-settings" class="btn btn-outline-light btn-sm" title="Settings">
            ⚙️
          </button>
        </div>
      </div>
    </div>
    
    <!-- Quick Filter Options (Collapsible) -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-header bg-light text-dark py-2 collapsible-header" data-target="quickFiltersCollapse" style="cursor: pointer;">
        <h6 class="card-title mb-0 d-flex justify-content-between align-items-center">
          <span>🔍 Quick Filters</span>
          <span class="collapse-icon">▼</span>
        </h6>
      </div>
      <div class="collapse-content" id="quickFiltersCollapse" style="display: none;">
        <div class="card-body py-2">
          <div class="custom-control custom-checkbox mb-2">
            <input type="checkbox" class="custom-control-input" id="popup-filter-approvals">
            <label class="custom-control-label" for="popup-filter-approvals">
              <small>Only show PRs with less than 2 approvals</small>
            </label>
          </div>
          <div class="custom-control custom-checkbox mb-2">
            <input type="checkbox" class="custom-control-input" id="popup-filter-my-approval">
            <label class="custom-control-label" for="popup-filter-my-approval">
              <small>Hide PRs I've already approved</small>
            </label>
          </div>
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="popup-filter-wip">
            <label class="custom-control-label" for="popup-filter-wip">
              <small>Exclude Work In Progress PRs</small>
            </label>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="d-flex flex-column mb-3">
      <button id="check-now" class="btn btn-outline-primary btn-block mb-2">
        <span class="mr-2">🔔</span>
        Check Now
      </button>
      
      <button id="show-pr-overview" class="btn btn-outline-secondary btn-block">
        <span class="mr-2">📋</span>
        Show PR Overview
      </button>
    </div>
    
    <!-- PR List (Collapsible) -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-header bg-success text-white py-2 collapsible-header" data-target="prListCollapse" style="cursor: pointer;">
        <h6 class="card-title mb-0 d-flex justify-content-between align-items-center">
          <span>📁 Repository List</span>
          <span class="collapse-icon">▲</span>
        </h6>
      </div>
      <div class="collapse-content" id="prListCollapse" style="display: block;">
        <div class="card-body py-2">
          <div id="pr-list"></div>
        </div>
      </div>
    </div>
    
    <!-- PR Overview Section (Collapsible) -->
    <div id="pr-overview-section" class="card border-0 shadow-sm mb-3" style="display: none;">
      <div class="card-header bg-info text-white py-2 collapsible-header" data-target="prOverviewCollapse" style="cursor: pointer;">
        <h6 class="card-title mb-0 d-flex justify-content-between align-items-center">
          <span>📋 PR Overview</span>
          <div class="d-flex align-items-center">
            <span class="collapse-icon mr-2">▲</span>
            <button id="close-pr-overview" class="btn btn-outline-light btn-sm">
              ✕
            </button>
          </div>
        </h6>
      </div>
      <div class="collapse-content" id="prOverviewCollapse" style="display: block;">
        <div class="card-body">
          <div id="pr-overview-content" class="pr-overview-content mb-3"></div>
          <div class="text-center">
            <button id="copy-pr-overview" class="btn btn-outline-secondary">
              <span class="mr-2">📋</span>
              Copy to Clipboard
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Status Message -->
    <div id="status-message" class="alert alert-info" role="alert" style="display: none;">
      <span id="status-text"></span>
    </div>
  </div>
  
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
